# Build and deploy the upstream demo site to GitHub Pages.
#
# This is the template's own demo, not the workflow a course gets: it builds
# with the hosting overlay in docusaurus.pages.config.js and is skipped outside
# this repository. Courses built from the template run `npx course setup-pages`,
# which generates their own deploy.yml.
name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'lars-derichter/canvas-course-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx docusaurus build --config docusaurus.pages.config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
